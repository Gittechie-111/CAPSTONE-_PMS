{% extends "admin/base.html" %}

{% block title %}{% if subtitle %}{{ subtitle }} | {% endif %}{{ title }} | CPMS Admin{% endblock %}

{% block branding %}
<div id="site-name"><a href="{% url 'admin:index' %}">CPMS Administration</a></div>
{% endblock %}

{% block nav-global %}{% endblock %}

{% block extrastyle %}{{ block.super }}
<style>
  /* Django fixes the dashboard column at 600px, which is the cramping */
  .dashboard #content { width: auto; max-width: none; padding: 24px 40px; }
  .dashboard #content-main { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 20px; align-items: start; }
  .dashboard #content-main .module { margin: 0; border-radius: 10px; overflow: hidden; }
  .dashboard .module table { width: 100%; }
  .dashboard .module th, .dashboard .module td { padding: 12px 16px; }
  .dashboard .module caption { padding: 12px 16px; font-size: 0.8rem; letter-spacing: .06em; }
  #content { padding: 24px 40px; }
  .results td, .results th { padding: 10px 14px; }
  .module { border-radius: 10px; }
  .button, input[type=submit], .submit-row input { border-radius: 6px; padding: 8px 16px; }
</style>
{% endblock %}
